# cargo-audit configuration (read from .cargo/audit.toml at the workspace root).
#
# Ignored advisories must stay justified here; remove the entry as soon as
# the upstream fix lands.

[advisories]
# RUSTSEC-2026-0235 (rkyv 0.7.46, OOB reads): rkyv 0.7 enters Cargo.lock only
# as an optional, never-enabled dependency of rust_decimal (cucumber-tests
# uses features = ["serde"] only). It is absent from the build graph —
# `cargo tree -i rkyv@0.7.46` prints nothing — so no artifact compiles it.
# The workspace itself uses rkyv 0.8.18 (fixed line). rust_decimal 1.42.1
# (latest) still pins the optional dep to ^0.7.46; drop this ignore once
# rust_decimal moves it to >=0.8.17.
# RUSTSEC-2023-0071 (rsa 0.9, Marvin timing attack): rsa enters the graph only
# through openidconnect behind lithair-core's opt-in `oidc` feature. Marvin
# recovers private keys from the timing of private-key operations (RSA
# decryption/signing). The relying party only verifies provider signatures with
# public keys, which the advisory does not affect; the private-key signing in
# tests/oidc_test.rs is a test-only provider. No fixed rsa release exists; drop
# this entry once openidconnect depends on a fixed rsa.
ignore = ["RUSTSEC-2026-0235", "RUSTSEC-2023-0071"]
