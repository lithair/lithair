[package]
name = "lithair-turso"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Experimental opt-in Turso document storage for Lithair models"
keywords = ["lithair", "turso", "database", "declarative"]
categories = ["database", "web-programming::http-server"]

[dependencies]
lithair-core = { path = "../lithair-core", version = "1.12.0", default-features = false }
turso = { version = "=0.7.2", default-features = false }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
http-body-util.workspace = true
bytes = "1"
url = "2"

[dev-dependencies]
lithair-macros = { path = "../lithair-macros", version = "1.12.0" }
tempfile = "3"
reqwest.workspace = true
chrono.workspace = true
