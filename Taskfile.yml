version: '3'

vars:
  PORT: '18321'
  HOST: '127.0.0.1'
  LEADER: "http://{{.HOST}}:{{.PORT}}"
  TOTAL: '20000'
  CONC: '512'
  BYTES: '1024'
  ACCEPT_ENCODING: ''
  RUST_LOG: 'info'
  OPS: '10000'
  SINGLE_NODE: '0'
  STORAGE_PROFILE: 'high_throughput'

tasks:
  help:
    desc: Show documented tasks and common variables
    cmds:
      - |
          cat <<'EOF'
          Lithair Taskfile - Common tasks:
            task build                 # Build debug binaries
            task build:release        # Build release binaries
            task fmt                  # Run rustfmt on the workspace
            task fmt:check            # Check rustfmt (no changes)
            task lint                 # Run clippy with -D warnings
            task test                 # Run all tests
            task check                # Fast host-native check (fmt:check + clippy)
            task ci                   # Full CI pipeline via cidx (containerized)
            task pr                   # PR validation via cidx (code + test)
            task setup                # Bootstrap the dev environment
            task examples:list        # List current workspace examples
            task examples:test        # Compile all root examples
            task examples:hello-world # Run the minimal example
            task examples:rbac-session # Run auth + sessions example
            task examples:blog:serve  # Run the blog example
            task examples:replication:hardening # Run HTTP hardening example
            task examples:replication:firewall  # Run firewall example
            task loadgen:status       # /status load test
            task loadgen:json         # /perf/json load test
            task loadgen:echo         # /perf/echo load test
            task bench:json-small     # Preset: JSON 1KB
            task bench:json-large     # Preset: JSON 64KB
            task bench:echo-large     # Preset: ECHO 1MB
            task raft:consistency     # Raft consistency test (3-node auto)
            task raft:consistency:heavy # Heavy load consistency test
            task docs                 # Show docs pointers
            task bdd:setup            # Install Cucumber dependencies
            task bdd:run              # Run all Cucumber tests
            task bdd:persistence      # Event sourcing + hash chain tests
            task bdd:performance      # Performance + durability benchmarks
            task bdd:scaffolding      # CLI scaffolding tests
            task bdd:distribution     # Cluster replication tests
            task bdd:all              # Run all BDD tests

          Variables (override as needed):
            PORT, HOST, TOTAL, CONC, BYTES, ACCEPT_ENCODING, RUST_LOG

          Example:
            task loadgen:json PORT=18321 CONC=1024 BYTES=65536 ACCEPT_ENCODING=gzip

          📋 CI/Testing Tasks (cidx.toml is the single source of truth for CI):
          task check        - Host-native fmt:check + clippy -D warnings (seconds)
          task pr           - cidx run pr (code + test, containerized)
          task ci           - cidx run ci (security + code + test + build, full GitHub parity)
          task smoke        - Functional validation (firewall/hardening demos) ~5-10min
          task bdd:all      - Run all BDD test suites
          task bdd:setup    - Install Cucumber dependencies
          task docs:lint    - Lint Markdown documentation files
          task docs:lint:fix - Auto-fix Markdown documentation files

          💡 Use 'task check' for the inner loop, 'task ci' before pushing!
          EOF

  default:
    desc: Default entry point - shows Taskfile help
    cmds:
      - task: help
  build:
    desc: Build selected root example binaries and replication load generator
    cmds:
      - cargo build -q -p hello-world
      - cargo build -q -p loadgen

  fmt:
    desc: Run rustfmt on the entire workspace
    cmds:
      - cargo fmt

  fmt:check:
    desc: Check rustfmt formatting (no changes)
    cmds:
      - cargo fmt -- --check

  lint:
    desc: Run clippy lints with -D warnings
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  test:
    desc: Run all tests in the workspace
    cmds:
      - cargo test --workspace --all-features

  check:
    desc: Fast host-native check (fmt:check + clippy -D warnings, no container)
    cmds:
      - task: fmt:check
      - task: lint

  ci:
    desc: Full CI pipeline via cidx (security + code + test + build — GitHub parity)
    cmds:
      - cidx run ci

  pr:
    desc: PR validation via cidx (code + test, no build artifacts)
    cmds:
      - cidx run pr

  setup:
    desc: Bootstrap the dev environment (rustup, go-task, cidx, probatum)
    cmds:
      - bash scripts/setup.sh

  smoke:
    desc: Functional smoke tests (firewall + hardening demos, example suites)
    cmds:
      - echo "🚀 Running smoke tests..."
      - echo "🔧 Ensuring demo scripts are executable..."
      - chmod +x examples/advanced/http-firewall/run_demo.sh
      - chmod +x examples/advanced/http-firewall/run_declarative_demo.sh
      - chmod +x examples/advanced/http-hardening/run_demo.sh
      - echo "💨 Smoke - Firewall demo (configurable)..."
      - PORT=19100 bash examples/advanced/http-firewall/run_demo.sh
      - echo "💨 Smoke - Firewall demo (model-level declarative)..."
      - PORT=19101 bash examples/advanced/http-firewall/run_declarative_demo.sh
      - echo "💨 Smoke - HTTP hardening demo..."
      - PORT=19102 bash examples/advanced/http-hardening/run_demo.sh
      - echo "💨 Smoke - Example test suites..."
      - bash scripts/test-examples.sh
      - echo "🎉 All smoke tests completed successfully!"

  build:release:
    desc: Build release binaries for root examples and replication load generator
    cmds:
      - cargo build --release -p hello-world
      - cargo build --release -p loadgen

  examples:list:
    desc: List current root examples
    cmds:
      - cat examples/README.md

  examples:test:
    desc: Compile all root example workspace packages
    cmds:
      - cargo build --workspace --exclude lithair-core --exclude lithair-macros --exclude lithair-cli --exclude cucumber-tests

  examples:hello-world:
    desc: Run the minimal hello-world example
    cmds:
      - cargo run -p hello-world

  examples:hello-world:release:
    desc: Run the minimal hello-world example in release mode
    cmds:
      - cargo run --release -p hello-world

  examples:replication:firewall:
    desc: Run the advanced HTTP firewall demo script
    cmds:
      - bash examples/advanced/http-firewall/run_demo.sh

  examples:replication:hardening:
    desc: Run the advanced HTTP hardening demo script
    cmds:
      - bash examples/advanced/http-hardening/run_demo.sh

  clean:
    desc: Clean cargo artifacts (debug & release)
    cmds:
      - cargo clean

  loadgen:status:
    desc: Run stateless /status load test against the server
    deps: [build]
    cmds:
      - cargo run -q -p loadgen -- --leader {{.LEADER}} --total {{.TOTAL}} --concurrency {{.CONC}} --mode perf-status --perf-path /status --accept-encoding "{{.ACCEPT_ENCODING}}"

  loadgen:status:release:
    desc: Run stateless /status load test (release build)
    deps: [build:release]
    cmds:
      - target/release/loadgen --leader {{.LEADER}} --total {{.TOTAL}} --concurrency {{.CONC}} --mode perf-status --perf-path /status --accept-encoding "{{.ACCEPT_ENCODING}}"

  loadgen:json:
    desc: Run stateless /perf/json load test against the server
    deps: [build]
    cmds:
      - cargo run -q -p loadgen -- --leader {{.LEADER}} --total {{.TOTAL}} --concurrency {{.CONC}} --mode perf-json --perf-path /perf/json --perf-bytes {{.BYTES}} --accept-encoding "{{.ACCEPT_ENCODING}}"

  loadgen:json:release:
    desc: Run stateless /perf/json load test (release build)
    deps: [build:release]
    cmds:
      - target/release/loadgen --leader {{.LEADER}} --total {{.TOTAL}} --concurrency {{.CONC}} --mode perf-json --perf-path /perf/json --perf-bytes {{.BYTES}} --accept-encoding "{{.ACCEPT_ENCODING}}"

  loadgen:echo:
    desc: Run stateless /perf/echo load test against the server
    deps: [build]
    cmds:
      - cargo run -q -p loadgen -- --leader {{.LEADER}} --total {{.TOTAL}} --concurrency {{.CONC}} --mode perf-echo --perf-path /perf/echo --perf-bytes {{.BYTES}} --accept-encoding "{{.ACCEPT_ENCODING}}"

  loadgen:echo:release:
    desc: Run stateless /perf/echo load test (release build)
    deps: [build:release]
    cmds:
      - target/release/loadgen --leader {{.LEADER}} --total {{.TOTAL}} --concurrency {{.CONC}} --mode perf-echo --perf-path /perf/echo --perf-bytes {{.BYTES}} --accept-encoding "{{.ACCEPT_ENCODING}}"

  bench:json-small:
    desc: Preset benchmark - JSON 1KB, 20k total, 512 concurrency
    cmds:
      - task: loadgen:json
        vars: { BYTES: '1024', TOTAL: '20000', CONC: '512' }

  bench:json-large:
    desc: Preset benchmark - JSON 64KB, 20k total, 512 concurrency
    cmds:
      - task: loadgen:json
        vars: { BYTES: '65536', TOTAL: '20000', CONC: '512' }

  bench:echo-large:
    desc: Preset benchmark - ECHO 1MB, 10k total, 256 concurrency
    cmds:
      - task: loadgen:echo
        vars: { BYTES: '1048576', TOTAL: '10000', CONC: '256' }

  bench:baselines:
    desc: "G4: CRUD throughput/latency, Lithair vs Axum+SQLite (docs/performance/baselines.md)"
    cmds:
      - ./benchmarks/run.sh

  raft:consistency:
    desc: Run Raft consistency test (3 nodes, auto-launch, verify replication)
    vars:
      OPS: '{{.OPS | default "100"}}'
      CONC: '{{.CONC | default "10"}}'
      SETTLE: '{{.SETTLE | default "3000"}}'
    cmds:
      - |
          echo "🧪 Raft Consistency Test"
          echo "   Ops/table: {{.OPS}}, Concurrency: {{.CONC}}, Settle: {{.SETTLE}}ms"
          pkill -9 playground_node 2>/dev/null || true
          rm -rf data/playground_node_* data/raft 2>/dev/null || true
          sleep 1
          cargo run -q -p raft_consistency_test -- --ops {{.OPS}} --concurrency {{.CONC}} --settle-time {{.SETTLE}}

  raft:consistency:clean:
    desc: Clean Raft data and run fresh consistency test
    cmds:
      - pkill -9 playground_node 2>/dev/null || true
      - rm -rf data/playground_node_* data/raft
      - task raft:consistency

  raft:consistency:heavy:
    desc: Heavy load consistency test (500 ops, 50 concurrency)
    cmds:
      - task: raft:consistency
        vars:
          OPS: '500'
          CONC: '50'
          SETTLE: '5000'

  examples:rbac-session:
    desc: Run RBAC session demo with persistent sessions
    cmds:
      - cargo run -p auth-sessions

  examples:rbac-session:frontend:
    desc: Run RBAC session demo with frontend UI
    cmds:
      - |
          echo "🚀 Starting RBAC Session Demo with Frontend..."
          echo "📂 Frontend: http://localhost:3000"
          echo "🔐 Quick login: Click on demo user cards"
          echo ""
          cargo run -p auth-sessions

  examples:rbac-session:test:
    desc: Test RBAC session demo with automated curl tests
    cmds:
      - |
          echo "🚀 Starting RBAC Session Demo..."
          cargo build -q -p auth-sessions

          # Start server in background
          cargo run -q -p auth-sessions -- --sessions-dir ./examples/06-auth-sessions/data/test_sessions 2>/dev/null &
          SERVER_PID=$!
          sleep 3

          echo "✅ Server started (PID: $SERVER_PID)"
          echo ""

          # Test 1: Login as bob (Employee)
          echo "📝 Test 1: Login as bob (Employee)"
          TOKEN=$(curl -s -X POST http://localhost:3000/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"bob","password":"password123"}' | jq -r '.session_token')
          echo "   Token: $TOKEN"
          echo ""

          # Test 2: Create products (bob has Employee role)
          echo "📦 Test 2: Create laptop product"
          curl -s -X POST http://localhost:3000/api/products \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"id":"1","name":"Laptop","price":999.99}' | jq .
          echo ""

          echo "📦 Test 3: Create mouse product"
          curl -s -X POST http://localhost:3000/api/products \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"id":"2","name":"Mouse","price":29.99}' | jq .
          echo ""

          # Test 4: List products
          echo "📋 Test 4: List all products"
          curl -s http://localhost:3000/api/products \
            -H "Authorization: Bearer $TOKEN" | jq .
          echo ""

          # Test 5: Check event sourcing persistence
          echo "💾 Test 5: Verify event sourcing (.raftlog files)"
          ls -lh ./examples/06-auth-sessions/data/test_sessions/*.raft* 2>/dev/null || echo "No .raftlog files yet"
          echo ""
          echo "📂 Event log contents:"
          cat ./examples/06-auth-sessions/data/test_sessions/events.raftlog 2>/dev/null | jq -s '.' || echo "No events yet"
          echo ""

          # Test 6: Logout
          echo "👋 Test 6: Logout"
          curl -s -X POST http://localhost:3000/auth/logout \
            -H "Authorization: Bearer $TOKEN" | jq .
          echo ""

          # Cleanup
          kill $SERVER_PID 2>/dev/null || true
          echo "✅ All tests completed!"

  examples:blog:serve:
    desc: Run the blog example (frontend + sessions + RBAC)
    cmds:
      - cargo run -p blog -- --port {{.PORT}}

  examples:blog:test:
    desc: Build and run automated tests for the blog example (login + RBAC + CRUD)
    env:
      HOST: "{{.HOST}}"
      PORT: "3005"
      RUST_LOG: "{{.RUST_LOG}}"
    cmds:
      - bash examples/04-blog/test.sh

  docs:
    desc: Show key documentation pointers and example guides
    cmds:
      - |
          cat <<'EOF'
          Lithair Documentation:
            - Overview:                 docs/README.md
            - Getting Started:          docs/guides/getting-started.md
            - Data-First Philosophy:    docs/guides/data-first-philosophy.md
            - HTTP Performance Endpoints: docs/guides/http_performance_endpoints.md
            - HTTP Hardening, Gzip & FW:  docs/guides/http_hardening_gzip_firewall.md
            - Architecture Overview:    docs/architecture/overview.md
            - Examples Overview:        docs/examples/overview.md

          Root Examples:
            - Index:                    examples/README.md
            - Blog:                     examples/04-blog/README.md
            - Auth sessions:            examples/06-auth-sessions/README.md
            - Replication:              examples/09-replication/README.md

          Examples Quick Entry (Taskfile):
            - task help
            - task examples:list
            - task examples:hello-world
            - task loadgen:json LEADER=http://127.0.0.1:18321 BYTES=65536 CONC=1024
          EOF

  docs:lint:
    desc: Lint Markdown files with markdownlint-cli (via npx)
    cmds:
      - npx -y markdownlint-cli@0.45.0 --config .markdownlint.json "docs/**/*.md" "README.md"

  docs:lint:fix:
    desc: Auto-fix Markdown files with markdownlint-cli (via npx)
    cmds:
      - npx -y markdownlint-cli@0.45.0 --config .markdownlint.json --fix "docs/**/*.md" "README.md"

  docs:build:
    desc: Build documentation with mdBook (outputs to lithair-website/public/docs)
    dir: docs
    cmds:
      - mdbook build
      - rm -rf ../../lithair-website/public/docs/internal

  docs:serve:
    desc: Serve documentation locally with hot-reload
    dir: docs
    cmds:
      - mdbook serve --open

  docs:clean:
    desc: Clean built documentation
    cmds:
      - rm -rf ../lithair-website/public/docs

  # 🥒 Cucumber BDD Testing Tasks
  bdd:setup:
    desc: "Install Cucumber CLI and dependencies"
    cmds:
      - cd cucumber-tests && cargo install cucumber-cli
      - echo "🥒 Cucumber CLI installed successfully"

  bdd:run:
    desc: "Run all Cucumber BDD tests"
    cmds:
      - cd cucumber-tests && cargo run --bin cucumber -- -i "features/**/*.feature"
      - echo "✅ All Cucumber tests completed"

  bdd:performance:
    desc: "Run performance BDD tests (engine benchmarks, durability, serialization)"
    cmds:
      - cd cucumber-tests && cargo run --bin cucumber -- -i "features/performance/**/*.feature"
      - echo "🚀 Performance BDD tests completed"

  bdd:distribution:
    desc: "Run distribution/cluster BDD tests (replication, leader election)"
    cmds:
      - cd cucumber-tests && cargo run --bin cucumber -- -i "features/core/*cluster*.feature"
      - echo "🔄 Distribution BDD tests completed"

  bdd:persistence:
    desc: "Run persistence BDD tests (event sourcing, hash chain)"
    cmds:
      - cd cucumber-tests && cargo run --bin cucumber -- -i "features/persistence/**/*.feature"
      - echo "💾 Persistence BDD tests completed"

  bdd:scaffolding:
    desc: "Run scaffolding BDD tests (lithair new CLI)"
    cmds:
      # Uses its own ScaffoldingWorld runner, not the main cucumber binary
      - cd cucumber-tests && cargo test --test scaffolding_test
      - echo "🔧 Scaffolding BDD tests completed"


  bdd:all:
    desc: "Run all BDD tests with comprehensive report"
    cmds:
      - task: bdd:persistence
      - task: bdd:performance
      - task: bdd:scaffolding
      - task: bdd:distribution
      - echo "🎉 All BDD test suites passed successfully!"

  bdd:ci:
    desc: "Run BDD tests in CI mode (no interactive output)"
    cmds:
      - cd cucumber-tests && RUST_LOG=warn cargo run --bin cucumber -- -i "../features/**/*.feature" --format json > test-results/cucumber-results.json
      - echo "📋 BDD CI results saved to test-results/cucumber-results.json"
