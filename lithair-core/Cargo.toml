[package]
name = "lithair-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Declarative memory-first web framework with built-in event sourcing, RBAC, and distributed consensus"
keywords = ["web", "framework", "event-sourcing", "declarative", "performance"]
categories = ["web-programming::http-server", "database-implementations"]

[lib]
name = "lithair_core"
path = "src/lib.rs"
doctest = false

# Examples are in separate workspace packages in ../examples/

[dependencies]
openraft = { version = "0.9", features = ["serde"], optional = true }
openraft-memstore = { version = "0.9", optional = true }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"
simd-json = "0.14"                                        # SIMD-accelerated JSON parsing (~3GB/s)
rkyv = { version = "0.8", features = ["bytecheck", "std"] }       # Zero-copy serialization (~10GB/s)
toml = "0.8"
# High-performance serialization
bincode = { version = "2", features = ["serde"] }        # Binary serialization (3-5x faster than JSON)
chrono = { version = "0.4", features = ["serde"] }  # Timestamps for metadata
scc = "3"            # SCC2 HashMap ultra-performant (40M+ ops/sec)
reqwest = { version = "0.13", features = ["json", "rustls", "form"], default-features = false }  # HTTP client with rustls
uuid = { version = "1", features = ["v4", "serde"] }  # For generating unique IDs with Serde
clap = { version = "4", features = ["derive"] }  # CLI argument parsing for auto-generated apps
hyper = { version = "1.7", features = ["full"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
async-stream = "0.3"
flate2 = "1"
sha2 = "0.10"
hmac = "0.12"                  # HMAC for JWT signatures (crypto-secure)
argon2 = "0.5"                 # Password hashing (OWASP recommended)
base64 = "0.22"                # Proper base64 encoding/decoding
rustls = { version = "0.23", features = ["ring"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }
hex = "0.4"
ipnet = "2"
brotli = "8"
bytes = "1"
# `log` stays: ~550 existing `log::*` call sites flow into `tracing` via the
# `tracing-log` bridge (issue #107 phase 1) — no mass migration.
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
tracing-log = "0.2"
# OpenTelemetry OTLP exporter stack (issue #107 phase 2), gated behind the
# off-by-default `otel` feature. The four crates are version-paired and must
# be bumped together: tracing-opentelemetry 0.33.x requires opentelemetry
# ^0.32, and opentelemetry-otlp 0.32 requires opentelemetry_sdk ^0.32
# (checked against the crates.io dependency metadata of each release).
opentelemetry = { version = "0.32", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"], optional = true }
# `tracing-log` feature kept: our log→tracing bridge (phase 1) means many
# events reaching the otel layer originate from `log::*` records, and this
# feature normalizes their metadata. `metrics` dropped — #107 phase 2 is
# traces only (/metrics stays Prometheus).
tracing-opentelemetry = { version = "0.33", default-features = false, features = ["tracing-log"], optional = true }
mime_guess = "2"
rand = "0.8"
crc32fast = "1.4"  # CRC32 checksums for data integrity validation
# MFA/TOTP support
totp-rs = { version = "5.7", features = ["gen_secret", "qr", "serde"], optional = true }  # Battle-tested TOTP implementation
# OpenAPI documentation support (optional)
utoipa = { version = "5", optional = true }
thiserror = "2.0.17"
futures.workspace = true
lithair-macros = { version = "1.0.0", path = "../lithair-macros", optional = true }
tempfile = "3"

[dev-dependencies]
# Random free-port picker for integration tests that spawn a real
# `LithairServer` (e.g. tests/require_session_test.rs). Already used in
# cucumber-tests under the same name.
portpicker = "0.1"
urlencoding = "2.1" # tests URL-encode attack probes (per_model_stats_test)
# Auto-compaction tests (issue #69) use tokio's virtual-time control
# (`start_paused`, `tokio::time::advance`), which is gated behind the
# `test-util` feature. The main `tokio = { features = ["full"] }` import
# does NOT include test-util, so we add it here scoped to tests only.
tokio = { version = "1", features = ["test-util", "macros", "rt"] }

[features]
default = ["macros"]

# Re-export derive macros from lithair-macros (recommended)
macros = ["lithair-macros"]

# TLS termination (rustls)
tls = ["rustls", "tokio-rustls", "rustls-pemfile"]

# Multi-Factor Authentication (TOTP)
mfa = ["totp-rs"]

# Distributed consensus (OpenRaft)
cluster = ["openraft", "openraft-memstore"]

# OpenAPI/Swagger documentation support
openapi = ["utoipa"]

# OpenTelemetry OTLP trace export (issue #107 phase 2). Off by default:
# default builds compile zero otel code and behave byte-identically.
# Activation at runtime is via LT_OTEL_ENDPOINT (see app::init_default_tracing).
otel = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "tracing-opentelemetry"]

# Data Admin UI - Embedded dashboard for database browsing
# Adds ~30KB to binary when enabled
admin-ui = []

# All optional features
full = ["macros", "tls", "mfa", "cluster", "openapi", "admin-ui"]

