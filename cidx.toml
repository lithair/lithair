# lithair — cidx configuration
#
# Run locally:
#   cidx run code      # rustfmt + clippy
#   cidx run security  # cargo-audit + gitleaks + trivy
#   cidx run test      # unit + integration + behavior BDD (per-PR pyramid)
#   cidx run build     # workspace release build
#   cidx run ci        # full pipeline
#
# CI executes the same phases via .github/workflows/cidx.yml.
# Validate edits with: cidx validate
# Inspect a preset with: cidx preset info <name>

# ─── phases ───
[security]
containers = ["cargo-audit", "gitleaks", "trivy"]

[code]
containers = ["rustfmt", "clippy"]

[test]
containers = ["cargo-test"]

[build]
containers = ["cargo-build"]

# ─── container overrides ───
# The full per-PR test pyramid (issue #132):
#   1. unit: workspace lib + bins;
#   2. integration: lithair-core/tests/ — real server boots + HTTP
#      assertions (~20s execution, compile is the only real cost);
#   3. behavior BDD: the fast cucumber suites (persistence event-sourcing/
#      hash-chain/retention, scaffolding CLI, serialization modes). The
#      explicit `cargo build -p lithair-cli` produces target/debug/lithair —
#      `cargo test --bins` only builds test harnesses, not the artifact the
#      scaffolding steps execute (caught on a cold GH runner; local target
#      dirs had a stale binary).
# Performance/stress/cluster BDD suites stay OUT of the per-PR gate —
# they are long-running by design and run via `task bdd:*` / nightly.
# Debug profile on purpose: execution is seconds — compile time dominates,
# and a release test build blew past the 30 min container deadline on
# GitHub runners (the Build phase still compiles release). The scaffolding
# suite finds target/debug/lithair (lithair_binary() probes both).
[containers.cargo-test]
timeout = "50m"
command = "sh -c 'cargo test --workspace --lib --bins && cargo test -p lithair-core --tests && cargo build -p lithair-cli && cargo test -p cucumber-tests --test no_orphan_features --test cucumber_tests --test behavior_models_test --test scaffolding_test --test serialization_test'"

# Workspace-aware release build.
[containers.cargo-build]
command = "cargo build --workspace --release"

# Trivy filesystem scan. `--skip-dirs target` excludes build artifacts:
# `cargo package` leaves frozen Cargo.locks under target/package/ that
# report already-fixed historical CVEs. Source Cargo.lock stays scanned.
# `--exit-code 0` matches existing policy — trivy stays informational;
# cargo-audit is the hard gate on Rust deps.
[containers.trivy]
command = "fs --severity HIGH,CRITICAL --skip-dirs target --exit-code 0 /scan"

# cargo-audit: two transitive unmaintained warnings remain (bincode 2.x,
# rustls-pemfile 2.x) with no published replacement. The preset default
# adds `--deny warnings` which would fail on them; override the command
# to run plain `cargo audit` (still fails on real vulnerabilities, just
# not on warnings) until upstream replacements ship.
[containers.cargo-audit]
command = "sh -c 'command -v cargo-audit || cargo install --quiet cargo-audit && cargo audit'"

# ─── pipelines ───
[pipelines.ci]
phases = ["security", "code", "test", "build"]
description = "Full CI pipeline"

[pipelines.pr]
phases = ["code", "test"]
description = "Pull request validation (no build artifacts)"
