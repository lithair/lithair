# lithair — cidx configuration
#
# Run locally:
#   cidx run code      # rustfmt + clippy
#   cidx run security  # cargo-audit + gitleaks + trivy
#   cidx run test      # unit + integration + behavior BDD (per-PR pyramid)
#   cidx run build     # workspace release build
#   cidx run cluster   # Probatum + three-node Docker Compose qualification
#   cidx run ci        # full pipeline
#
# CI executes the same phases via .github/workflows/cidx.yml.
# Validate edits with: cidx validate
# Inspect a preset with: cidx preset info <name>

# ─── phases ───
[security]
containers = ["cargo-audit", "gitleaks", "trivy"]

[code]
containers = ["rustfmt", "clippy"]

[test]
containers = ["cargo-test"]

[cluster]
containers = ["cluster-build", "cluster-probatum"]

[build]
containers = ["cargo-build"]

# ─── container overrides ───
# The full per-PR test pyramid (issue #132):
#   1. unit: workspace lib + bins;
#   2. integration: lithair-core/tests/ — real server boots + HTTP
#      assertions (~20s execution, compile is the only real cost);
#   3. behavior BDD: the fast cucumber suites (persistence event-sourcing/
#      hash-chain/retention, scaffolding CLI, serialization modes). The
#      explicit `cargo build -p lithair-cli` produces target/debug/lithair —
#      `cargo test --bins` only builds test harnesses, not the artifact the
#      scaffolding steps execute (caught on a cold GH runner; local target
#      dirs had a stale binary).
# Performance/stress/legacy cluster BDD suites stay OUT of the per-PR gate —
# they are long-running by design and run via `task bdd:*` / nightly.
# Debug profile on purpose: execution is seconds — compile time dominates,
# and a release test build blew past the 30 min container deadline on
# GitHub runners (the Build phase still compiles release). The scaffolding
# suite finds target/debug/lithair (lithair_binary() probes both).
[containers.cargo-test]
timeout = "50m"
command = "sh -c 'cargo test -p lithair-core --features cluster,tls --lib cluster::native && cargo test -p lithair-core --features cluster,tls --test native_cluster_test && cargo test --workspace --lib --bins && cargo test -p lithair-core --tests && cargo test -p lithair-core --features cluster,tls --test native_checkpoint_test --test native_scc2_test --test native_http_commit_test --test openraft_storage_test --test openraft_consensus_test --test openraft_checkpoint_test --test openraft_identity_test --test cluster_operator_test && cargo test -p lithair-macros --tests && cargo test -p lithair-turso --tests && cargo test -p lithair-cli --features cluster-ops --test cluster_ops && cargo build -p lithair-cli && cargo test -p cucumber-tests --features cluster-ops --test no_orphan_features --test native_checkpoint_bdd --test native_http_commit_bdd --test native_scc2_bdd --test cucumber_tests --test behavior_models_test --test scaffolding_test --test serialization_test --test sessions_test --test turso_test --test openraft_storage_bdd --test openraft_consensus_bdd --test openraft_checkpoint_bdd --test openraft_identity_bdd --test cluster_operator_bdd --test native_cluster_bdd'"

# Workspace-aware release build.
[containers.cargo-build]
command = "sh -c 'cargo build --workspace --release && cargo build -p lithair-cli --features cluster-ops --release'"

# Check the private cluster/TLS foundation and its executable harness too;
# the default feature set does not compile those modules.
[containers.clippy]
command = "sh -c 'rustup component add clippy && cargo clippy -- -D warnings && cargo clippy -p lithair-core --features cluster,tls --test native_checkpoint_test --test native_scc2_test --test native_http_commit_test --test openraft_storage_test --test openraft_consensus_test --test openraft_checkpoint_test --test openraft_identity_test --test cluster_operator_test --test native_cluster_test --example cluster-compose-node -- -D warnings && cargo clippy -p lithair-cli --features cluster-ops --test cluster_ops -- -D warnings && cargo clippy -p cucumber-tests --features cluster-ops --test native_checkpoint_bdd --test native_http_commit_bdd --test openraft_consensus_bdd --test openraft_checkpoint_bdd --test openraft_identity_bdd --test cluster_operator_bdd --test native_cluster_bdd -- -D warnings'"

# Trivy filesystem scan. `--skip-dirs target` excludes build artifacts:
# `cargo package` leaves frozen Cargo.locks under target/package/ that
# report already-fixed historical CVEs. Source Cargo.lock stays scanned.
# `--exit-code 0` matches existing policy — trivy stays informational;
# cargo-audit is the hard gate on Rust deps.
[containers.trivy]
# Keep the scan path and mount explicit across upstream preset changes.
workdir = "/scan"
volumes = ["${WORKSPACE}:/scan"]
command = "fs --severity HIGH,CRITICAL --skip-dirs target --exit-code 0 /scan"

# cargo-audit: two transitive unmaintained warnings remain (bincode 2.x,
# rustls-pemfile 2.x) with no published replacement. The preset default
# adds `--deny warnings` which would fail on them; override the command
# to run plain `cargo audit` (still fails on real vulnerabilities, just
# not on warnings) until upstream replacements ship.
# `--locked` keeps the install on cargo-audit's shipped Cargo.lock —
# reproducible install, immune to fresh-resolution MSRV surprises
# (kstring >=2.0.3 once broke the build on an older pinned toolchain).
# The trailing `cargo tree` guard polices the RUSTSEC-2026-0235 ignore in
# .cargo/audit.toml: rkyv 0.7 sits in Cargo.lock as a never-enabled optional
# dep of rust_decimal, so the audit ignore is safe ONLY while it stays out of
# the build graph. If a future feature change enables it, `cargo tree -i`
# starts printing dependents and the phase fails instead of staying silent.
[containers.cargo-audit]
# This override invokes cargo install/tree, so it requires the pinned Rust image
# even when the upstream cargo-audit preset uses a standalone audit binary.
image = "rust:1.97.1-slim@sha256:3b2879047d42784ca9403ad20c51ed3df361a50f1df96f5777d39b4e33aa65cd"
command = "sh -c 'command -v cargo-audit || cargo install --quiet --locked cargo-audit && cargo audit && test -z \"$(cargo tree -i rkyv@0.7.46 --target all 2>/dev/null)\"'"

# ─── pipelines ───
[pipelines.ci]
phases = ["security", "code", "test", "cluster", "build"]
description = "Full CI pipeline"

[pipelines.pr]
phases = ["code", "test"]
description = "Pull request validation (no build artifacts)"

# The fixture is deliberately a test-only example, not an application server.
[containers.cluster-build]
image = "rust:1.97.1-slim@sha256:3b2879047d42784ca9403ad20c51ed3df361a50f1df96f5777d39b4e33aa65cd"
command = "cargo build -p lithair-core --features cluster,tls --example cluster-compose-node"
workdir = "/work"
volumes = ["${WORKSPACE}:/work"]
timeout = "20m"

[containers.cluster-probatum]
image = "docker:29.7.1-cli@sha256:27a51d5ab1cd38d9eeaba7b415b8c07bc10c31e1cf1ec8d78f6413fcfab3f44f"
entrypoint = ["sh"]
command = "tests/cluster/run.sh"
workdir = "/work"
volumes = ["${WORKSPACE}:/work", "/var/run/docker.sock:/var/run/docker.sock"]
privileged = true
ephemeral = true
timeout = "20m"

[containers.cluster-probatum.env]
LITHAIR_CLUSTER_INJECT_FAILURE = "${LITHAIR_CLUSTER_INJECT_FAILURE}"
