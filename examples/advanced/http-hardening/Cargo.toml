[package]
name = "http-hardening"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Lithair HTTP Hardening Demo - Security hardening and observability features"
authors = ["Yoan Roblet (Arcker)"]

[[bin]]
name = "http-hardening-node"
path = "src/main.rs"

[features]
default = []
open_by_default = []

[dependencies]
# Core Lithair framework
lithair-core = { path = "../../../lithair-core" }
lithair-macros = { path = "../../../lithair-macros" }

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

# Utilities
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.47", features = ["full"] }
log = "0.4"
env_logger = "0.11"
