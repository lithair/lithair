[package]
name = "replication"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Lithair Distributed Replication Demo - Simple multi-node example"
authors = ["Yoan Roblet (Arcker)"]

[[bin]]
name = "replication-declarative-node"
path = "pure_declarative_node.rs"

[dependencies]
# Core Lithair framework
lithair-core = { path = "../../lithair-core" }
lithair-macros = { path = "../../lithair-macros" }

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

# Async Runtime
tokio = { version = "1.47", features = ["full"] }

# Utilities
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
