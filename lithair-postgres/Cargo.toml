[package]
name = "lithair-postgres"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Experimental opt-in PostgreSQL document storage for Lithair models"
keywords = ["lithair", "postgresql", "database", "declarative"]
categories = ["database", "web-programming::http-server"]

[dependencies]
lithair-core = { path = "../lithair-core", version = "1.16.1", default-features = false }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
deadpool-postgres = { version = "0.14.2", features = ["rt_tokio_1"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-native-certs = "0.8"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
http-body-util.workspace = true
bytes = "1"
url = "2"

[dev-dependencies]
lithair-macros = { path = "../lithair-macros", version = "1.16.1" }
reqwest.workspace = true
uuid = { version = "1", features = ["v4"] }
