[package]
name = "lithair-postgres"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Experimental opt-in PostgreSQL document storage for Lithair models"
keywords = ["lithair", "postgresql", "database", "declarative"]
categories = ["database", "web-programming::http-server"]

[dependencies]
lithair-core = { path = "../lithair-core", version = "1.18.0", default-features = false }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
deadpool-postgres = { version = "0.14.2", features = ["rt_tokio_1"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-native-certs = "0.8"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
anyhow = "1"
log = "0.4"
async-trait = "0.1"

[dev-dependencies]
# tests/parity.rs: one document-store contract on Turso and PostgreSQL.
lithair-turso = { path = "../lithair-turso" }
url = "2"
# tests/postgres_cluster.rs: PostgreSQL models next to a native cluster (RFC 296 Q5).
lithair-core = { path = "../lithair-core", version = "1.18.0", features = ["cluster", "tls"] }
rcgen = "0.14"
sha2 = "0.10"
tempfile = "3"
lithair-macros = { path = "../lithair-macros", version = "1.18.0" }
reqwest.workspace = true
uuid = { version = "1", features = ["v4"] }
