# Generated by cidx generate github
# Source of truth: cidx.toml
#
# Regenerate with: cidx generate github -o .github/workflows/cidx.yml

name: CIDX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: Install CIDX
        run: |
          mkdir -p bin
          go install github.com/cidx-org/cidx/v3/cmd/cidx@v3.8.0
          cp "$(go env GOPATH)/bin/cidx" bin/cidx
      - uses: actions/upload-artifact@v7
        with:
          name: cidx-binary
          path: bin/cidx
          retention-days: 1

  code:
    name: Code
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: cidx-binary
          path: bin
      - run: chmod +x bin/cidx
      - uses: actions/cache@v6
        with:
          path: |
            target
          key: ${{ runner.os }}-cidx-code-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Run code
        run: ./bin/cidx run code

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: cidx-binary
          path: bin
      - run: chmod +x bin/cidx
      - uses: actions/cache@v6
        with:
          path: |
            target
          key: ${{ runner.os }}-cidx-test-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Run test
        run: ./bin/cidx run test

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: cidx-binary
          path: bin
      - run: chmod +x bin/cidx
      - name: Run security
        run: ./bin/cidx run security

  cluster:
    name: Cluster
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: cidx-binary
          path: bin
      - run: chmod +x bin/cidx
      - name: Run cluster
        run: ./bin/cidx run cluster
      - name: Upload cluster-probatum-evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cluster-probatum-evidence
          path: |
            .probatum/runs/lithair-cluster-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [bootstrap]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: cidx-binary
          path: bin
      - run: chmod +x bin/cidx
      - uses: actions/cache@v6
        with:
          path: |
            target
          key: ${{ runner.os }}-cidx-build-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Run build
        run: ./bin/cidx run build

