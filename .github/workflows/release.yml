name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section between "## [VERSION]" and the next "## [".
          # Write directly to a file to preserve backticks, dollar signs, and
          # other shell metacharacters that would otherwise be interpreted
          # if passed via `--notes "..."` on the command line.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && $0 ~ /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > /tmp/release-notes.md

          # Fall back to the annotated tag message if no CHANGELOG section.
          if [ ! -s /tmp/release-notes.md ]; then
            git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" > /tmp/release-notes.md
          fi

          # Final fallback: a minimal message.
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}. See CHANGELOG.md for details." > /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            --latest

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Explicit crate list, dependency order: the workspace also contains
      # the examples and cucumber-tests, which are not publishable, so
      # `cargo publish --workspace` cannot be used. cargo waits for each
      # crate to be available in the index before the next publish.
      # ponytail: a partial failure (e.g. core rejected after macros went
      # through) needs a manual finish — add per-crate "already published"
      # checks only if that ever actually happens.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p lithair-macros
          cargo publish -p lithair-core
          cargo publish -p lithair-cli
