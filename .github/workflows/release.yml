name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section between "## [VERSION]" and the next "## [".
          # Write directly to a file to preserve backticks, dollar signs, and
          # other shell metacharacters that would otherwise be interpreted
          # if passed via `--notes "..."` on the command line.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && $0 ~ /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > /tmp/release-notes.md

          # Fall back to the annotated tag message if no CHANGELOG section.
          if [ ! -s /tmp/release-notes.md ]; then
            git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" > /tmp/release-notes.md
          fi

          # Final fallback: a minimal message.
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}. See CHANGELOG.md for details." > /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            --latest

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The publish job needs no GitHub credentials after checkout.
          persist-credentials: false

      # Explicit crate list, dependency order: the workspace also contains
      # the examples and cucumber-tests, which are not publishable, so
      # `cargo publish --workspace` cannot be used. cargo waits for each
      # crate to be available in the index before the next publish.
      #
      # Idempotent: crate versions are immutable, so a rerun after a
      # partial failure (say, core rejected after macros went through)
      # must skip what already published. The sparse index needs no auth;
      # the li/th prefix path is shared by all three lithair-* crates.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for crate in lithair-macros lithair-core lithair-cli; do
            if curl -fsSL "https://index.crates.io/li/th/$crate" \
                | grep -q "\"vers\":\"$VERSION\""; then
              echo "$crate $VERSION already on crates.io, skipping"
              continue
            fi
            cargo publish -p "$crate"
          done
