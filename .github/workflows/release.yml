name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section between "## [VERSION]" and the next "## ["
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && $0 ~ /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md)

          # Fall back to the annotated tag message if no CHANGELOG section.
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES=$(git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}")
          fi

          # Final fallback: a minimal message.
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Release ${GITHUB_REF_NAME}. See CHANGELOG.md for details."
          fi

          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "${{ steps.notes.outputs.notes }}" \
            --latest
